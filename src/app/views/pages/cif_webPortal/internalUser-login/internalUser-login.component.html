<div class="row w-100 mx-0 auth-page">
  <!-- <div class="col-md-8 col-xl-6 mx-auto"> -->
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-6 pe-md-0">
        <!-- <div class="auth-side-wrapper" [ngStyle]="{ 'background-image': 'url(https://via.placeholder.com/219x452)' }"> -->
        <div class="auth-side-wrapper" style="height: 40rem;"
          [ngStyle]="{ 'background-image': 'url(https://www.lpu.in/lpu-assets/images/cif/login-left.png)' }">
        </div>
      </div>
      <div class="col-md-6 ps-md-0">
        <div class="auth-form-wrapper px-4 py-5">
          <a routerLink="." class="nobleui-logo d-block mb-2">CIF <span>Admin Portal</span></a>
          <form class="forms-sample" [formGroup]="formdata" (ngSubmit)="OnSubmit()">
            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label">User Id</label>
              <input type="text" formControlName="Email" placeholder="Enter UID " class="form-control" 
                id="exampleInputEmail1">
            </div>
            <div class="mb-3">
              <label for="exampleInputPassword1" class="form-label">Password</label>
              <input type="password" formControlName="password" class="form-control" placeholder="Enter Password"
                id="exampleInputPassword1" autocomplete="current-password">
            </div>

            <div>
              <button type="submit" class="btn btn-primary me-2 mb-2 mb-md-0" [disabled]=formdata.invalid>
                Login</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
